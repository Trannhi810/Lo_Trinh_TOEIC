<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro & Todo | Luyện TOEIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="bg.css" />
  <style>
    :root {
      --bg: transparent;
      --bg2: rgba(10, 12, 28, 0.80);
      --bg3: rgba(14, 17, 36, 0.75);
      --card-border: rgba(99,102,241,0.16);
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #8892b0;
      --text-dim: #4a5568;
      --radius: 18px;
      --shadow: 0 8px 40px rgba(0,0,0,0.55);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: #060816;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Page Background */
    .page-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .page-bg::before {
      content: ''; position: absolute; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%);
      top: -200px; left: -150px; animation: float1 14s ease-in-out infinite;
    }
    .page-bg::after {
      content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px; animation: float2 18s ease-in-out infinite;
    }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-60px)} }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      padding: 0 28px; display: flex; align-items: center; justify-content: space-between;
      height: 64px;
      border-bottom: 1px solid rgba(99,102,241,0.12);
      background: rgba(6,8,22,0.88); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }
    .logo-text { font-size: 16px; font-weight: 700; color: var(--text); }
    .logo-text span { color: var(--primary-light); }

    .header-nav { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); text-decoration: none; transition: var(--transition); border: 1px solid transparent;
    }
    .nav-link:hover { color: var(--text); background: rgba(99,102,241,0.1); border-color: var(--card-border); }
    .nav-link.active { color: var(--primary-light); background: rgba(99,102,241,0.14); border-color: rgba(99,102,241,0.3); }

    /* Layout Grid */
    .main {
      position: relative; z-index: 1; max-width: 1180px; margin: 0 auto;
      padding: 36px 24px 100px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; padding: 24px 16px 80px; gap: 20px; }
    }

    /* Panels */
    .panel-box {
      background: var(--bg2); border: 1px solid var(--card-border);
      border-radius: 24px; padding: 28px 30px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      backdrop-filter: blur(16px);
    }
    .panel-title {
      font-size: 17px; font-weight: 800; margin-bottom: 22px;
      display: flex; align-items: center; gap: 9px; letter-spacing: -0.3px;
    }

    /* POMODORO */
    .pomo-tabs {
      display: flex; gap: 5px; background: var(--bg3); border-radius: 12px; padding: 5px; margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .pomo-tab {
      flex: 1; padding: 8px 6px; border-radius: 9px; border: none; font-size: 12.5px; font-weight: 700;
      color: var(--text-muted); background: transparent; cursor: pointer; transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }
    .pomo-tab.active {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .pomo-tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.05); }

    .timer-display {
      font-family: 'JetBrains Mono', monospace; font-size: 78px; font-weight: 800; line-height: 1;
      text-align: center; margin-bottom: 30px;
      background: linear-gradient(135deg, #fff 30%, var(--primary-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -3px;
    }

    .pomo-controls { display: flex; justify-content: center; gap: 14px; }
    .pomo-btn {
      padding: 13px 26px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
      font-family: 'Inter', sans-serif;
    }
    .btn-main {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff;
      box-shadow: 0 6px 22px rgba(99,102,241,0.42); min-width: 140px; justify-content: center;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(99,102,241,0.5); }
    .btn-secondary {
      background: var(--bg3); color: var(--text-muted); border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: rgba(99,102,241,0.3); }

    /* TODO LIST */
    .todo-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .todo-input {
      flex: 1; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--card-border);
      background: var(--bg3); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: var(--transition);
    }
    .todo-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.14); }
    .todo-add {
      padding: 11px 18px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff; font-weight: 700; cursor: pointer; transition: var(--transition);
      font-family: 'Inter', sans-serif; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .todo-add:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,0.45); }

    .todo-list { display: flex; flex-direction: column; gap: 9px; flex: 1; overflow-y: auto; max-height: 380px; padding-right: 4px; }
    .todo-list::-webkit-scrollbar { width: 4px; }
    .todo-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

    .todo-item {
      display: flex; align-items: center; gap: 12px; padding: 13px 15px;
      background: var(--bg3); border: 1px solid var(--card-border); border-radius: 13px; transition: var(--transition);
    }
    .todo-item:hover { border-color: rgba(99,102,241,0.35); transform: translateX(2px); }
    .todo-checkbox {
      appearance: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
      cursor: pointer; position: relative; transition: var(--transition); flex-shrink: 0;
    }
    .todo-checkbox:checked { background: var(--success); border-color: var(--success); }
    .todo-checkbox:checked::after {
      content: '✓'; color: #fff; font-size: 12px; font-weight: 900;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .todo-text { flex: 1; font-size: 14px; font-weight: 500; transition: var(--transition); line-height: 1.4; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-dim); }
    .todo-del {
      background: none; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer;
      transition: var(--transition); padding: 4px; border-radius: 6px; line-height: 1;
    }
    .todo-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
    .empty-todo { text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px 20px; font-style: italic; }

    /* TOAST */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600;
      background: rgba(10,12,28,0.95); border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
      display: flex; align-items: center; gap: 8px; backdrop-filter: blur(16px);
    }
    .toast.success { border-color: rgba(16,185,129,0.5); color: #6ee7b7; }
    .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    @keyframes toastIn  { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none} }
    @keyframes toastOut { to{opacity:0;transform:translateX(16px)} }

    /* POMO SETTINGS MODAL */
    .pomo-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .pomo-modal-overlay.show { opacity: 1; pointer-events: auto; }
    .pomo-modal {
      background: var(--bg2); border: 1px solid var(--card-border); border-radius: 22px;
      padding: 28px; width: 90%; max-width: 400px;
      transform: translateY(20px); transition: transform 0.3s; box-shadow: var(--shadow);
    }
    .pomo-modal-overlay.show .pomo-modal { transform: translateY(0); }
    .pomo-modal-title { font-size: 17px; font-weight: 800; margin-bottom: 22px; }
    .pomo-modal-group { margin-bottom: 16px; }
    .pomo-modal-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
    .pomo-modal-group input {
      width: 100%; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--card-border);
      background: var(--bg3); color: var(--text); font-family: 'Inter'; outline: none;
      transition: var(--transition); font-size: 15px;
    }
    .pomo-modal-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.14); }
    .pomo-modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .pomo-modal-btns button {
      padding: 9px 20px; border-radius: 11px; border: none; font-family: 'Inter'; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: var(--transition);
    }
    .pomo-modal-btns .btn-cancel { background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .pomo-modal-btns .btn-save {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }

    /* YOUTUBE LINK MANAGER */
    .yt-panel { grid-column: 1 / -1; }
    .yt-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 22px; }
    @media (max-width: 600px) { .yt-form { grid-template-columns: 1fr; } }
    .yt-input {
      padding: 12px 16px; border-radius: 12px; border: 1px solid var(--card-border);
      background: var(--bg3); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: var(--transition);
    }
    .yt-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .yt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .yt-card {
      background: var(--bg3); border: 1px solid var(--card-border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; transition: var(--transition);
    }
    .yt-card:hover { transform: translateY(-2px); border-color: rgba(99,102,241,0.4); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .yt-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .yt-thumb { width: 100%; height: 100%; object-fit: cover; }
    .yt-play-btn {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 32px; text-decoration: none;
      transition: var(--transition);
    }
    .yt-card:hover .yt-play-btn { background: rgba(239,68,68,0.7); }
    .yt-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .yt-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
    .yt-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .yt-link-btn { font-size: 12px; color: var(--primary-light); text-decoration: none; font-weight: 500; }
    .yt-link-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page-bg"></div>

  <header class="header">
    <a href="index.html" class="header-logo">
      <div class="logo-icon">🍅</div>
      <span class="logo-text">TOEIC <span>Pomodoro</span></span>
    </a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">🗺️ Lộ Trình</a>
      <a href="flashcard.html" class="nav-link">🃏 Flashcard</a>
      <a href="pomodoro.html" class="nav-link active">🍅 Pomodoro & Todo</a>
      <a href="#" onclick="openBgModal(event)" class="nav-link" style="border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);">🖼️ Hình nền</a>
    </nav>
  </header>

  <main class="main">
    <!-- POMODORO -->
    <div class="panel-box">
      <div class="panel-title" style="justify-content: space-between;">
        <div style="display:flex; align-items:center; gap:10px;">⏱️ Pomodoro Timer</div>
        <button onclick="openPomoSettings()" style="background:none; border:none; cursor:pointer; font-size:18px;" title="Cài đặt thời gian">⚙️</button>
      </div>
      <div class="pomo-tabs">
        <button class="pomo-tab active" id="tab-focus" onclick="setMode('focus')">Tập Trung (<span id="lbl-focus">25</span>p)</button>
        <button class="pomo-tab" id="tab-short" onclick="setMode('short')">Nghỉ Ngắn (<span id="lbl-short">5</span>p)</button>
        <button class="pomo-tab" id="tab-long" onclick="setMode('long')">Nghỉ Dài (<span id="lbl-long">15</span>p)</button>
      </div>
      <div class="timer-display" id="time-left">25:00</div>
      <div class="pomo-controls">
        <button class="pomo-btn btn-main" id="btn-toggle" onclick="toggleTimer()">▶ Bắt Đầu</button>
        <button class="pomo-btn btn-secondary" onclick="resetTimer()">↺ Đặt lại</button>
      </div>
    </div>

    <!-- TODO LIST -->
    <div class="panel-box">
      <div class="panel-title">📋 Việc Cần Làm</div>
      <form class="todo-form" onsubmit="addTodo(event)">
        <input type="text" id="todo-input" class="todo-input" placeholder="Thêm mục tiêu bài học..." required />
        <button type="submit" class="todo-add">Thêm</button>
      </form>
      <div class="todo-list" id="todo-list"></div>
    </div>

    <!-- YOUTUBE LINK MANAGER -->
    <div class="panel-box yt-panel">
      <div class="panel-title">📺 Kho Link YouTube Học TOEIC</div>
      <form class="yt-form" onsubmit="addYoutubeLink(event)">
        <input type="text" id="yt-title" class="yt-input" placeholder="Tiêu đề video / Bài học..." required />
        <input type="url" id="yt-url" class="yt-input" placeholder="Dán link YouTube tại đây (https://youtube.com/watch?...)..." required />
        <button type="submit" class="todo-add">Lưu Link</button>
      </form>
      <div class="yt-grid" id="yt-grid"></div>
    </div>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- Pomo Settings Modal -->
  <div class="pomo-modal-overlay" id="pomo-modal" onclick="closePomoSettings(event)">
    <div class="pomo-modal" onclick="event.stopPropagation()">
      <div class="pomo-modal-title">⚙️ Cài đặt thời gian (Phút)</div>
      <div class="pomo-modal-group">
        <label>Tập trung (Focus)</label>
        <input type="number" id="inp-focus" min="1" max="120" />
      </div>
      <div class="pomo-modal-group">
        <label>Nghỉ ngắn (Short Break)</label>
        <input type="number" id="inp-short" min="1" max="60" />
      </div>
      <div class="pomo-modal-group">
        <label>Nghỉ dài (Long Break)</label>
        <input type="number" id="inp-long" min="1" max="60" />
      </div>
      <div class="pomo-modal-btns">
        <button class="bg-btn bg-btn-cancel" onclick="closePomoSettings()">Hủy</button>
        <button class="bg-btn bg-btn-apply" onclick="savePomoSettings()">✓ Lưu</button>
      </div>
    </div>
  </div>

  <!-- Audio for timer end -->
  <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    // ==========================================
    // POMODORO LOGIC
    // ==========================================
    let MODES = {
      focus: 25 * 60,
      short: 5 * 60,
      long: 15 * 60
    };
    
    function loadPomoSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem('toeic_pomo_settings'));
        if (saved) {
          if (saved.focus) MODES.focus = saved.focus * 60;
          if (saved.short) MODES.short = saved.short * 60;
          if (saved.long)  MODES.long  = saved.long * 60;
        }
      } catch(e) {}
      
      document.getElementById('lbl-focus').textContent = Math.round(MODES.focus / 60);
      document.getElementById('lbl-short').textContent = Math.round(MODES.short / 60);
      document.getElementById('lbl-long').textContent  = Math.round(MODES.long / 60);
    }
    
    function openPomoSettings(e) {
      if(e) e.preventDefault();
      document.getElementById('inp-focus').value = Math.round(MODES.focus / 60);
      document.getElementById('inp-short').value = Math.round(MODES.short / 60);
      document.getElementById('inp-long').value  = Math.round(MODES.long / 60);
      document.getElementById('pomo-modal').classList.add('show');
    }
    
    function closePomoSettings(e) {
      if (e && e.target.id !== 'pomo-modal') return;
      document.getElementById('pomo-modal').classList.remove('show');
    }
    
    function savePomoSettings() {
      const f = parseInt(document.getElementById('inp-focus').value) || 25;
      const s = parseInt(document.getElementById('inp-short').value) || 5;
      const l = parseInt(document.getElementById('inp-long').value) || 15;
      
      localStorage.setItem('toeic_pomo_settings', JSON.stringify({ focus: f, short: s, long: l }));
      loadPomoSettings();
      closePomoSettings();
      
      // Reset timer if not running
      if (!isRunning) {
        timeLeft = MODES[currentMode];
        updateTimerDisplay();
      }
      showToast('Đã lưu cài đặt Pomodoro', 'success');
    }
    
    let currentMode = 'focus';
    let timeLeft = MODES[currentMode];
    let timerId = null;
    let isRunning = false;

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      document.getElementById('time-left').textContent = formatTime(timeLeft);
      document.title = `${formatTime(timeLeft)} - Pomodoro | TOEIC`;
    }

    function setMode(mode) {
      if (isRunning) toggleTimer(); // pause if running
      currentMode = mode;
      timeLeft = MODES[mode];
      
      // Update UI tabs
      document.querySelectorAll('.pomo-tab').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + mode).classList.add('active');
      
      updateTimerDisplay();
    }

    function toggleTimer() {
      const btn = document.getElementById('btn-toggle');
      if (isRunning) {
        clearInterval(timerId);
        btn.innerHTML = '▶ Tiếp tục';
        btn.style.background = '';
        isRunning = false;
      } else {
        btn.innerHTML = '⏸ Tạm dừng';
        btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        isRunning = true;
        
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerId);
            isRunning = false;
            btn.innerHTML = '▶ Bắt Đầu';
            btn.style.background = '';
            document.getElementById('alarm-sound').play().catch(()=>{});
            showToast('⏰ Hết giờ!', 'success');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (isRunning) toggleTimer(); // pause
      timeLeft = MODES[currentMode];
      updateTimerDisplay();
      document.getElementById('btn-toggle').innerHTML = '▶ Bắt Đầu';
      document.getElementById('btn-toggle').style.background = '';
    }

    // ==========================================
    // TODO LIST LOGIC
    // ==========================================
    let todos = [];

    function loadTodos() {
      try {
        const stored = localStorage.getItem('toeic_todos');
        if (stored) todos = JSON.parse(stored);
        if (!Array.isArray(todos)) todos = [];
      } catch (e) {
        todos = [];
      }
      renderTodos();
    }

    function saveTodos() {
      localStorage.setItem('toeic_todos', JSON.stringify(todos));
      if (window.FirebaseSync) window.FirebaseSync.saveData('todos', todos);
    }

    function renderTodos() {
      const list = document.getElementById('todo-list');
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty-todo">Chưa có công việc nào. Thêm việc cần làm nhé!</div>';
        return;
      }
      
      list.innerHTML = todos.map((todo, idx) => `
        <div class="todo-item ${todo.done ? 'done' : ''}">
          <input type="checkbox" class="todo-checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${idx})" />
          <span class="todo-text">${todo.text}</span>
          <button class="todo-del" onclick="deleteTodo(${idx})" title="Xóa">✕</button>
        </div>
      `).join('');
    }

    function addTodo(e) {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      
      todos.push({ text, done: false });
      saveTodos();
      renderTodos();
      input.value = '';
    }

    function toggleTodo(idx) {
      todos[idx].done = !todos[idx].done;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(idx) {
      todos.splice(idx, 1);
      saveTodos();
      renderTodos();
    }

    // ==========================================
    // YOUTUBE LINK LOGIC
    // ==========================================
    let youtubeLinks = [];

    function loadYoutubeLinks() {
      try {
        const stored = localStorage.getItem('toeic_yt_links');
        if (stored) youtubeLinks = JSON.parse(stored);
        if (!Array.isArray(youtubeLinks)) youtubeLinks = [];
      } catch (e) {
        youtubeLinks = [];
      }
      renderYoutubeLinks();
    }

    function saveYoutubeLinks() {
      localStorage.setItem('toeic_yt_links', JSON.stringify(youtubeLinks));
      if (window.FirebaseSync) window.FirebaseSync.saveData('youtubeLinks', youtubeLinks);
    }

    function extractYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function renderYoutubeLinks() {
      const grid = document.getElementById('yt-grid');
      if (youtubeLinks.length === 0) {
        grid.innerHTML = '<div class="empty-todo" style="grid-column: 1/-1;">Chưa có video nào. Lưu link YouTube để học lại nhé!</div>';
        return;
      }

      grid.innerHTML = youtubeLinks.map((item, idx) => {
        const ytid = extractYoutubeId(item.url);
        const thumbUrl = ytid ? `https://img.youtube.com/vi/${ytid}/mqdefault.jpg` : '';
        return `
          <div class="yt-card">
            ${ytid ? `
              <div class="yt-thumb-wrap">
                <img class="yt-thumb" src="${thumbUrl}" alt="${item.title}" />
                <a href="${item.url}" target="_blank" class="yt-play-btn" title="Xem trên YouTube">▶</a>
              </div>
            ` : ''}
            <div class="yt-info">
              <div class="yt-title">${item.title}</div>
              <div class="yt-actions">
                <a href="${item.url}" target="_blank" class="yt-link-btn">🔗 Mở Link YouTube</a>
                <button class="todo-del" onclick="deleteYoutubeLink(${idx})" title="Xóa">✕</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addYoutubeLink(e) {
      e.preventDefault();
      const titleInput = document.getElementById('yt-title');
      const urlInput = document.getElementById('yt-url');
      const title = titleInput.value.trim();
      const url = urlInput.value.trim();
      if (!title || !url) return;

      youtubeLinks.push({ title, url, id: Date.now() });
      saveYoutubeLinks();
      renderYoutubeLinks();
      titleInput.value = '';
      urlInput.value = '';
      showToast('📺 Đã lưu link YouTube thành công!', 'success');
    }

    function deleteYoutubeLink(idx) {
      youtubeLinks.splice(idx, 1);
      saveYoutubeLinks();
      renderYoutubeLinks();
      showToast('🗑️ Đã xóa link YouTube', 'success');
    }

    function showToast(msg, type='success') {
      const wrap = document.getElementById('toast-wrap');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => { if (wrap.contains(t)) wrap.removeChild(t); }, 3000);
    }

    // Initialize
    loadPomoSettings();
    timeLeft = MODES[currentMode];
    updateTimerDisplay();
    loadTodos();
    loadYoutubeLinks();

    // LISTEN TO FIREBASE REAL-TIME SYNC
    if (window.FirebaseSync) {
      window.FirebaseSync.onSync(data => {
        if (data) {
          let todoChanged = false;
          let ytChanged = false;
          if (data.todos && JSON.stringify(data.todos) !== JSON.stringify(todos)) {
            todos = data.todos || [];
            localStorage.setItem('toeic_todos', JSON.stringify(todos));
            todoChanged = true;
          }
          if (data.youtubeLinks && JSON.stringify(data.youtubeLinks) !== JSON.stringify(youtubeLinks)) {
            youtubeLinks = data.youtubeLinks || [];
            localStorage.setItem('toeic_yt_links', JSON.stringify(youtubeLinks));
            ytChanged = true;
          }
          if (todoChanged) renderTodos();
          if (ytChanged) renderYoutubeLinks();
        }
      });
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="bg.js"></script>
</body>
</html>
